name: Verify spoof consistency patch

on:
  push:
    paths:
      - 'Payload/Snapchat.app/Frameworks/SCRT.framework/SCRT'
      - 'tools/**'
      - 'tests/**'
      - 'analysis/manifest.json'
      - 'FILES.sha256'
      - '.github/workflows/test-spoof-consistency.yml'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/fix_spoof_consistency.py --check
