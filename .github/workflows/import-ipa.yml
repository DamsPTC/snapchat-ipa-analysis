name: Import exact IPA archive

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-exact-ipa
  cancel-in-progress: false

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v12.81.0-version-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - name: Download the exact archived IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v12.81.0-version-fix --repo "$GITHUB_REPOSITORY" --pattern Snapchat_DeviceCheck_etude_unsigned.ipa --dir "$RUNNER_TEMP/ipa-source"
      - name: Extract and verify every file without executing the app
        run: python3 tools/extract_ipa.py "$RUNNER_TEMP/ipa-source/Snapchat_DeviceCheck_etude_unsigned.ipa" .
      - name: Store the large executable with Git LFS and commit the extraction
        run: |
          git lfs install --local
          git lfs track "Payload/Snapchat.app/Snapchat"
          git add --all Payload analysis FILES.sha256 README.md .gitattributes
          if git diff --cached --quiet; then
            echo "The exact extraction is already committed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import exact Snapchat 12.81.0 archive with corrected version"
          git push origin HEAD:main
      - name: Verify extracted content and LFS objects
        run: |
          sha256sum --quiet -c FILES.sha256
          git lfs fsck
          git lfs ls-files
